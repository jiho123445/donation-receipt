<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사단법인 너브내행복나눔재단 - 기부금영수증 자동 발급시스템</title>
    <meta name="description" content="사단법인 너브내행복나눔재단 공식 기부금영수증 발급 및 후원금 관리 시스템" />

    <!--
      카카오톡 공유 시 미리보기(썸네일)에 사용되는 Open Graph 태그입니다.
      og:url / og:image는 반드시 실제 배포 도메인의 절대경로(https://...)여야 카카오톡이
      이미지를 정상적으로 가져갑니다. 도메인을 바꾸신 경우 아래 3곳(og:url, og:image,
      twitter:image)의 도메인을 실제 배포 주소로 함께 수정해주세요.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="사단법인 너브내행복나눔재단" />
    <meta property="og:title" content="사단법인 너브내행복나눔재단 - 기부금영수증·회비납부확인서 자동 발급시스템" />
    <meta property="og:description" content="후원금 및 회비 납부내역을 자동으로 계산하여 기부금영수증과 회비납부확인서를 발급·저장·전송합니다." />
    <meta property="og:url" content="https://donation-receipt-mu.vercel.app/" />
    <meta property="og:image" content="https://donation-receipt-mu.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="사단법인 너브내행복나눔재단 기부금영수증·회비납부확인서 자동 발급시스템" />
    <meta property="og:locale" content="ko_KR" />

    <!-- 카카오톡 인앱 브라우저 등 일부 환경은 twitter 카드 태그도 함께 참고합니다. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="사단법인 너브내행복나눔재단 - 기부금영수증·회비납부확인서 자동 발급시스템" />
    <meta name="twitter:description" content="후원금 및 회비 납부내역을 자동으로 계산하여 기부금영수증과 회비납부확인서를 발급·저장·전송합니다." />
    <meta name="twitter:image" content="https://donation-receipt-mu.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기부금영수증 PDF로 이동 중...</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #fefce8;
    color: #191919;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #191919;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  p { font-size: 15px; margin: 4px 0; }
  a {
    display: inline-block;
    margin-top: 18px;
    padding: 10px 18px;
    background: #fee500;
    color: #191919;
    font-weight: 700;
    text-decoration: none;
    border-radius: 10px;
  }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p>기부금영수증 PDF로 이동하는 중입니다...</p>
  <a id="fallback" href="#">PDF가 자동으로 열리지 않으면 여기를 눌러주세요</a>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('u');
      var fallback = document.getElementById('fallback');
      if (!raw) {
        document.body.innerHTML = '<p>잘못된 접근입니다. 링크를 다시 확인해주세요.</p>';
        return;
      }
      var target = raw;
      try {
        target = decodeURIComponent(raw);
      } catch (e) {
        /* raw가 이미 디코딩된 형태일 수 있음 */
      }
      fallback.href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
